<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n3xn Virtual FileSystem v2</title>
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="n3xn VFS" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // SW must control the page before Monaco uses /__monaco__/ (same-origin workers)
    window.__n3xnSwReady = (async function () {
      if (!("serviceWorker" in navigator)) return false;
      try {
        const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
        await navigator.serviceWorker.ready;
        if (navigator.serviceWorker.controller) return true;
        // First visit: SW installed but not controlling yet → one soft reload
        if (!sessionStorage.getItem("n3xn_sw_reload")) {
          sessionStorage.setItem("n3xn_sw_reload", "1");
          // Give activate/claim a moment
          await new Promise((r) => setTimeout(r, 300));
          if (navigator.serviceWorker.controller) return true;
          location.reload();
          return false;
        }
        return !!(navigator.serviceWorker.controller || reg.active);
      } catch (e) {
        console.warn("[n3xn] SW register failed", e);
        return false;
      }
    })();
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <!-- LOGIN / ACCOUNT SCREEN -->
  <div id="auth-screen" class="screen">
    <div class="auth-container glow-box">
      <h1 class="logo">n3xn <span>VFS</span> v2</h1>
      <p class="subtitle">Encrypted Virtual Filesystem — Local Only</p>
      <button type="button" id="btn-install-pwa" class="btn ghost small hidden" style="margin:8px auto;display:none">Install / Add to ChromeOS</button>

      <div id="login-view">
        <div class="form-group">
          <label>Account</label>
          <select id="account-select"></select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <button id="btn-login" class="btn primary">Sign In</button>
        <button id="btn-show-create" class="btn ghost">Create New Account</button>
        <button id="btn-import-accounts" class="btn ghost">Import Accounts / Full Export</button>
      </div>

      <div id="create-view" class="hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="new-username" placeholder="Choose username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="new-password" placeholder="Strong password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="new-password2" placeholder="Confirm" />
        </div>
        <button id="btn-create" class="btn primary">Create Account</button>
        <button id="btn-show-login" class="btn ghost">Back to Sign In</button>
      </div>

      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="brand">n3xn <span>VFS</span> <small>v2</small></div>
      <div class="path-bar">
        <span id="current-path">/</span>
      </div>
      <div class="user-area">
        <span id="current-user"></span>
        <button id="btn-github" class="btn small ghost" title="GitHub VFS">GitHub</button>
        <button id="btn-media" class="btn small ghost" title="Media / Meme editor">Media</button>
        <button id="btn-html-visual" class="btn small ghost" title="Visual HTML editor">HTML+</button>
        <button id="btn-fs-app" class="btn small ghost" title="Fullscreen app">⛶</button>
        <button id="btn-export-fs" class="btn small" title="Export entire encrypted FS">Export FS</button>
        <button id="btn-logout" class="btn small ghost">Logout</button>
      </div>
    </header>

    <div class="main-layout explorer-mode" id="main-layout">
      <div class="workspace">
        <!-- FILE EXPLORER — full screen until a file is opened -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>File Explorer</span>
            <div class="sidebar-actions">
              <button id="btn-new-file" class="icon-btn" title="New File">📄</button>
              <button id="btn-new-folder" class="icon-btn" title="New Folder">📁</button>
              <button id="btn-import" class="icon-btn" title="Import Files / Folder / ZIP">📥</button>
              <button id="btn-import-fs" class="icon-btn" title="Import FS (.n3xn.json)">📦</button>
              <button id="btn-import-downloads" class="icon-btn" title="Import Chromebook Downloads">💾</button>
              <button id="btn-rebuild-tree" class="icon-btn" title="Rebuild tree from storage">🔄</button>
            </div>
          </div>
          <div id="file-tree" class="file-tree"></div>
        </aside>

        <!-- EDITOR — only visible when a file is open -->
        <main class="editor-area" id="editor-area">
          <div class="editor-toolbar">
            <div class="tabs" id="editor-tabs"></div>
            <div class="run-bar" id="run-bar">
              <button id="btn-save" class="btn small" title="Save file (Ctrl+S)">💾 Save</button>
              <button id="btn-run" class="btn small primary" title="Run / Preview (Ctrl+Enter)">▶ Run</button>
              <select id="run-mode" title="Run mode">
                <option value="auto">Auto</option>
                <option value="html-window">HTML → Window (games)</option>
                <option value="html">HTML in-app</option>
                <option value="js">Run JS</option>
                <option value="python">Python (Pyodide)</option>
                <option value="n3-site">n3-site (multi-file HTML)</option>
                <option value="image">Image</option>
                <option value="markdown">Markdown</option>
                <option value="json">JSON</option>
                <option value="css">CSS Demo</option>
                <option value="text">Text</option>
                <option value="blob-open">Raw blob open</option>
              </select>
              <button id="btn-monaco-settings" class="btn small ghost" title="Monaco settings">⚙</button>
              <button id="btn-fs-editor" class="btn small ghost" title="Fullscreen editor">⛶</button>
              <button id="btn-preview-close-bar" class="btn small ghost hidden" title="Close preview">✕ Preview</button>
            </div>
          </div>
          <div class="editor-split" id="editor-split">
            <div id="monaco-container"></div>
            <div id="media-view" class="media-view hidden"></div>
            <div id="preview-container" class="hidden"></div>
          </div>
          <div id="empty-editor" class="empty-state">
            <p>Select a file or create a new one</p>
            <p class="hint">Monaco Editor · Ctrl+S save · Ctrl+Enter run</p>
          </div>
        </main>
      </div>

      <!-- TERMINAL — collapsible bottom panel -->
      <aside class="terminal-panel" id="terminal-panel">
        <div class="terminal-header" id="terminal-toggle">
          <span>Terminal</span>
          <div class="terminal-header-actions">
            <button id="btn-clear-term" class="icon-btn" title="Clear">🗑</button>
            <button id="btn-toggle-term" class="icon-btn" title="Collapse / Expand">▼</button>
          </div>
        </div>
        <div id="terminal-output" class="terminal-output"></div>
        <div class="terminal-input-row">
          <span class="prompt">n3xn@vfs:~$</span>
          <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" />
        </div>
      </aside>
    </div>

    <!-- STATUS BAR -->
    <footer class="statusbar">
      <span id="status-msg">Ready</span>
      <span id="status-stats"></span>
    </footer>
  </div>

  <!-- MODALS -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal glow-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn ghost">Cancel</button>
        <button id="modal-confirm" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="file-input" multiple hidden />
  <input type="file" id="folder-input" webkitdirectory directory multiple hidden />
  <input type="file" id="zip-input" accept=".zip" hidden />
  <input type="file" id="json-import" accept=".json,.n3xn" hidden />

  <!-- Single entry: app.js imports the rest. Avoids MIME failures from missing optional scripts. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
