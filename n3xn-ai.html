<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n3xn AI</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161a22; --card: #1c212b; --border: #2a3140;
      --text: #e8ecf4; --muted: #8b95a8; --accent: #6ea8fe;
      --good: #3dd68c; --warn: #f5a524; --bad: #f31260;
      --user: #2a3a5c; --assistant: #1e2430; --error-bg: #2a1518;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    .logo { font-weight: 700; font-size: 1.15rem; color: var(--accent); white-space: nowrap; }
    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button, input[type="text"] {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.9rem;
    }
    select, button { cursor: pointer; }
    select:hover, button:hover, input[type="text"]:focus { border-color: var(--accent); outline: none; }
    button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.small { padding: 6px 10px; font-size: 0.8rem; }
    main { flex: 1; display: flex; overflow: hidden; }
    aside {
      width: 320px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-section h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin-bottom: 10px;
    }
    .status-line {
      font-size: 0.85rem; margin-bottom: 6px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .status-ok { color: var(--good); } .status-warn { color: var(--warn); } .status-bad { color: var(--bad); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    textarea.system-prompt, textarea.library, input.base-url {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 8px; font-size: 0.85rem;
      font-family: inherit;
    }
    textarea.system-prompt { height: 80px; resize: vertical; }
    textarea.library { height: 140px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 90%; padding: 12px 16px; border-radius: 14px;
      line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant {
      align-self: flex-start; background: var(--assistant);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center; background: transparent; color: var(--muted);
      font-size: 0.85rem; text-align: center; max-width: 100%;
    }
    .msg.error {
      align-self: center; background: var(--error-bg); border: 1px solid var(--bad);
      color: #ff8a9a; font-size: 0.85rem; max-width: 95%;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .msg .role { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .input-area {
      padding: 12px 16px 16px; border-top: 1px solid var(--border);
      background: var(--panel); display: flex; gap: 10px; align-items: flex-end;
    }
    #userInput {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 0.95rem;
      resize: none; min-height: 48px; max-height: 140px; font-family: inherit;
    }
    #userInput:focus { outline: none; border-color: var(--accent); }
    #sendBtn { height: 48px; padding: 0 18px; border-radius: 12px; }
    #progressOverlay {
      display: none; position: fixed; inset: 0; background: rgba(15,17,21,0.85);
      z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    #progressOverlay.visible { display: flex; }
    .progress-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 32px; min-width: 300px; max-width: 90vw; text-align: center;
    }
    .progress-bar-bg { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; margin: 14px 0 8px; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    #progressText { font-size: 0.9rem; color: var(--muted); }
    .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-top: 8px; color: var(--muted); }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .saved-indicator { font-size: 0.75rem; color: var(--good); margin-top: 4px; min-height: 1.1em; }
    @media (max-width: 700px) {
      aside { position: fixed; left: -320px; top: 0; bottom: 0; z-index: 50; transition: left 0.25s; }
      aside.open { left: 0; }
      .menu-btn { display: inline-block !important; }
    }
    .menu-btn { display: none; }
  </style>
</head>
<body>
  <div id="progressOverlay">
    <div class="progress-box">
      <div id="progressTitle" style="font-weight:600;margin-bottom:4px">Loading model…</div>
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div id="progressText">Starting…</div>
    </div>
  </div>

  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="logo">n3xn AI</div>
    </div>
    <div class="header-controls">
      <select id="modelSelect">
        <option value="">Select a model…</option>
        <optgroup label="Tiny (start here)">
          <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (~210 MB)</option>
          <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC" selected>Qwen2.5 0.5B (~280 MB)</option>
          <option value="Qwen3-0.6B-q4f16_1-MLC">Qwen3 0.6B (~350 MB)</option>
        </optgroup>
        <optgroup label="Small">
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (~710 MB)</option>
          <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (~870 MB)</option>
          <option value="Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 Coder 1.5B (~870 MB)</option>
        </optgroup>
      </select>
      <button id="loadBtn" class="primary">Load Model</button>
      <button id="clearBtn">Clear Chat</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-section">
        <h3>Status</h3>
        <div class="status-line"><span>WebGPU</span><span id="webgpuStatus">checking…</span></div>
        <div class="status-line"><span>WebLLM</span><span id="webllmStatus">loading…</span></div>
        <div class="status-line"><span>Model</span><span id="modelStatus">None</span></div>
        <div class="status-line"><span>Engine</span><span id="engineStatus">Idle</span></div>
      </div>

      <div class="sidebar-section">
        <h3>Personality</h3>
        <label for="personality">Preset</label>
        <select id="personality" style="width:100%;margin-bottom:10px">
          <option value="default">Helpful & clear</option>
          <option value="chill">Chill & casual</option>
          <option value="concise">Very concise</option>
          <option value="coding">Coding assistant</option>
          <option value="custom">Custom (edit below)</option>
        </select>
        <label for="systemPrompt">System instructions</label>
        <textarea id="systemPrompt" class="system-prompt"></textarea>
      </div>

      <div class="sidebar-section">
        <h3>Knowledge Library</h3>
        <p class="note" style="margin-top:0;margin-bottom:8px">
          Extra facts the AI always sees. Edit freely — changes save automatically.
        </p>
        <textarea id="knowledgeLibrary" class="library" placeholder="Add facts, project notes, coding rules…"></textarea>
        <div class="btn-row">
          <button id="resetLibraryBtn" class="small">Reset to default</button>
          <button id="saveLibraryBtn" class="small primary">Save now</button>
        </div>
        <div id="librarySaved" class="saved-indicator"></div>
      </div>

      <div class="sidebar-section">
        <h3>Debug</h3>
        <div class="checkbox-row">
          <input type="checkbox" id="showErrors" checked>
          <label for="showErrors" style="margin:0">Show errors in chat</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="shareErrorsWithAI">
          <label for="shareErrorsWithAI" style="margin:0">Include errors when chatting</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="useLibrary" checked>
          <label for="useLibrary" style="margin:0">Inject knowledge library</label>
        </div>
      </div>
    </aside>

    <div class="chat-area">
      <div id="messages"></div>
      <div class="input-area">
        <textarea id="userInput" placeholder="Message n3xn AI…" rows="1"></textarea>
        <button id="sendBtn" class="primary" disabled>Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    let engine = null;
    let isGenerating = false;
    let webllmReady = false;
    let CreateMLCEngine = null;
    let recentErrors = [];
    let saveTimer = null;

    const STORAGE_KEY = "n3xn-ai-knowledge-v1";
    const PROMPT_KEY = "n3xn-ai-system-prompt-v1";

    const DEFAULT_KNOWLEDGE = `n3xn project facts:
- n3xn is a browser-based VFS (virtual file system) + coding environment that runs fully client-side.
- It supports HTML, CSS, JS, Python (Pyodide), React, games (Kaboom, Phaser, etc.), and more.
- Offline support is handled by a Service Worker with /__cdn__/ proxy paths for libraries.
- Models and chat can run fully offline after the first download.
- The user is often on a school Chromebook with limited memory — keep answers practical and not too long.
- Prefer clear, working code examples over long explanations.
- When helping with n3xn, talk about real features: VFS, terminal, runners, Monaco editor, offline packs, SW caching.`;

    const personalities = {
      default: "You are n3xn AI, a helpful local assistant running entirely in the browser inside the n3xn project. Be clear, direct, and practical. Keep answers reasonably short unless asked for more detail.",
      chill: "You are n3xn AI. Keep things relaxed, casual, and friendly. Use simple language. Light humor is ok.",
      concise: "You are n3xn AI. Give short, direct answers. Avoid filler. Get to the point quickly.",
      coding: "You are n3xn AI, a coding assistant focused on HTML, CSS, JavaScript, and the n3xn environment. Prefer clear explanations and working code examples."
    };

    const $ = (id) => document.getElementById(id);

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (role === "user" || role === "assistant") {
        const roleLabel = document.createElement("div");
        roleLabel.className = "role";
        roleLabel.textContent = role === "user" ? "You" : "n3xn AI";
        div.appendChild(roleLabel);
      }
      const text = document.createElement("div");
      text.textContent = content;
      div.appendChild(text);
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return text;
    }

    function addError(msg) {
      recentErrors.push(String(msg));
      if (recentErrors.length > 20) recentErrors.shift();
      if ($("showErrors")?.checked) addMessage("error", msg);
      console.error(msg);
    }

    function setStatus(id, text, cls = "") {
      const el = $(id);
      if (el) { el.textContent = text; el.className = cls; }
    }

    function showProgress(show, title = "Loading…", text = "", pct = 0) {
      const overlay = $("progressOverlay");
      if (show) {
        overlay.classList.add("visible");
        $("progressTitle").textContent = title;
        $("progressText").textContent = text;
        $("progressBar").style.width = Math.min(100, Math.max(0, pct)) + "%";
      } else {
        overlay.classList.remove("visible");
      }
    }

    function showSaved(msg = "Saved") {
      const el = $("librarySaved");
      el.textContent = msg;
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.textContent = ""; }, 2000);
    }

    // ---------- Persistence ----------
    function loadKnowledge() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved !== null ? saved : DEFAULT_KNOWLEDGE;
      } catch {
        return DEFAULT_KNOWLEDGE;
      }
    }

    function saveKnowledge(value) {
      try {
        localStorage.setItem(STORAGE_KEY, value);
        showSaved("Library saved");
      } catch (e) {
        showSaved("Save failed");
        addError("Could not save knowledge library: " + e.message);
      }
    }

    function loadSystemPrompt() {
      try {
        return localStorage.getItem(PROMPT_KEY) || personalities.default;
      } catch {
        return personalities.default;
      }
    }

    function saveSystemPrompt(value) {
      try {
        localStorage.setItem(PROMPT_KEY, value);
      } catch (_) {}
    }

    // ---------- UI helpers ----------
    function applyPersonality() {
      const val = $("personality").value;
      if (val !== "custom" && personalities[val]) {
        $("systemPrompt").value = personalities[val];
        saveSystemPrompt($("systemPrompt").value);
      }
    }

    function scheduleLibrarySave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveKnowledge($("knowledgeLibrary").value);
      }, 600);
    }

    // ---------- WebGPU / WebLLM ----------
    async function checkWebGPU() {
      if (!navigator.gpu) {
        setStatus("webgpuStatus", "Not supported", "status-bad");
        return false;
      }
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          setStatus("webgpuStatus", "No adapter", "status-bad");
          return false;
        }
        setStatus("webgpuStatus", "Available", "status-ok");
        return true;
      } catch (e) {
        setStatus("webgpuStatus", "Error", "status-bad");
        addError("WebGPU: " + e.message);
        return false;
      }
    }

    function buildCandidates() {
      const base = location.origin;
      return [
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm/+esm",
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm@0.2.85/+esm",
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
        "https://esm.run/@mlc-ai/web-llm",
        "https://esm.sh/@mlc-ai/web-llm",
      ];
    }

    async function tryImport(url) {
      const mod = await import(/* @vite-ignore */ url);
      let factory = mod.CreateMLCEngine;
      if (typeof factory !== "function" && mod.default) {
        factory = mod.default.CreateMLCEngine || mod.default;
      }
      if (typeof factory !== "function") throw new Error("CreateMLCEngine not found");
      return factory;
    }

    async function loadWebLLM() {
      setStatus("webllmStatus", "Loading…", "status-warn");
      for (const url of buildCandidates()) {
        try {
          addMessage("system", "Trying WebLLM:\n" + url);
          CreateMLCEngine = await tryImport(url);
          webllmReady = true;
          setStatus("webllmStatus", "Ready", "status-ok");
          addMessage("system", "WebLLM ready.");
          return true;
        } catch (err) {
          addError("WebLLM fail: " + url + "\n" + (err.message || err));
        }
      }
      setStatus("webllmStatus", "Failed", "status-bad");
      return false;
    }

    async function loadSelectedModel() {
      if (!webllmReady || !CreateMLCEngine) {
        addError("WebLLM not ready");
        return;
      }
      const modelId = $("modelSelect").value;
      if (!modelId) { alert("Select a model"); return; }
      if (isGenerating) return;

      $("loadBtn").disabled = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Loading…", "status-warn");
      showProgress(true, "Loading model…", "Please wait…", 0);

      try {
        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: (r) => {
            showProgress(true, "Loading model…", r.text || "", (r.progress || 0) * 100);
          }
        });
        const short = modelId.replace("-Instruct-q4f16_1-MLC", "").replace("-q4f16_1-MLC", "");
        setStatus("modelStatus", short, "status-ok");
        setStatus("engineStatus", "Ready", "status-ok");
        $("sendBtn").disabled = false;
        addMessage("system", "Model loaded: " + modelId);
      } catch (err) {
        setStatus("engineStatus", "Failed", "status-bad");
        setStatus("modelStatus", "None", "");
        addError("Model load failed: " + (err.message || err));
      } finally {
        showProgress(false);
        $("loadBtn").disabled = false;
      }
    }

    function buildSystemPrompt() {
      let prompt = ($("systemPrompt").value || "").trim() || personalities.default;

      if ($("useLibrary")?.checked) {
        const lib = ($("knowledgeLibrary").value || "").trim();
        if (lib) {
          prompt += "\n\n### Knowledge library (always use when relevant)\n" + lib;
        }
      }

      if ($("shareErrorsWithAI")?.checked && recentErrors.length) {
        prompt += "\n\nRecent browser errors:\n" + recentErrors.slice(-4).join("\n");
      }
      return prompt;
    }

    async function sendMessage() {
      if (!engine || isGenerating) return;
      const input = $("userInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      isGenerating = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Thinking…", "status-warn");
      const replyEl = addMessage("assistant", "…");

      try {
        const messages = [
          { role: "system", content: buildSystemPrompt() },
          { role: "user", content: text }
        ];
        let full = "";
        const completion = await engine.chat.completions.create({
          messages, stream: true, temperature: 0.7,
        });
        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          full += delta;
          replyEl.textContent = full || "…";
          $("messages").scrollTop = $("messages").scrollHeight;
        }
        if (!full) replyEl.textContent = "(No response)";
      } catch (err) {
        replyEl.textContent = "Error while generating.";
        addError("Gen error: " + (err.message || err));
      } finally {
        isGenerating = false;
        $("sendBtn").disabled = false;
        setStatus("engineStatus", "Ready", "status-ok");
        $("userInput").focus();
      }
    }

    function clearChat() {
      $("messages").innerHTML = "";
      recentErrors = [];
      addMessage("system", "Chat cleared.");
    }

    // Events
    $("loadBtn").addEventListener("click", loadSelectedModel);
    $("clearBtn").addEventListener("click", clearChat);
    $("sendBtn").addEventListener("click", sendMessage);
    $("personality").addEventListener("change", applyPersonality);
    $("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("open"));
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    $("knowledgeLibrary").addEventListener("input", scheduleLibrarySave);
    $("saveLibraryBtn").addEventListener("click", () => {
      saveKnowledge($("knowledgeLibrary").value);
    });
    $("resetLibraryBtn").addEventListener("click", () => {
      if (confirm("Reset knowledge library to the default n3xn facts?")) {
        $("knowledgeLibrary").value = DEFAULT_KNOWLEDGE;
        saveKnowledge(DEFAULT_KNOWLEDGE);
      }
    });
    $("systemPrompt").addEventListener("input", () => {
      $("personality").value = "custom";
      saveSystemPrompt($("systemPrompt").value);
    });

    // Init
    (async function init() {
      $("systemPrompt").value = loadSystemPrompt();
      $("knowledgeLibrary").value = loadKnowledge();

      addMessage("system", "n3xn AI starting…");
      await checkWebGPU();
      await loadWebLLM();
      if (webllmReady) {
        addMessage("system", "Ready. Knowledge library is active and editable in the sidebar.");
      }
    })();
  </script>
</body>
</html>
